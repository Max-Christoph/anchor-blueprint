name: anchor-blueprint

# Root-Orchestrierung. Alle Werte haben Fallbacks, damit `docker compose up -d`
# auch ohne .env-Datei startet (nur fuer lokale Entwicklung gedacht).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anchor}
      POSTGRES_USER: ${POSTGRES_USER:-anchor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-development}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app_net
    logging: *default-logging

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-0.2.0}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.2.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-20s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      DATABASE_URL: postgres://${POSTGRES_USER:-anchor}:${POSTGRES_PASSWORD:-change-me-in-development}@db:5432/${POSTGRES_DB:-anchor}?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      WORKER_URL: http://worker:8000
      WORKER_TIMEOUT: ${WORKER_TIMEOUT:-10s}
      # Auth: Standard im Code ist jwt. Lokal ohne OIDC laeuft dev_header.
      AUTH_MODE: ${AUTH_MODE:-dev_header}
      AUTH_BEARER_TOKEN: ${AUTH_BEARER_TOKEN:-dev-bearer-token-change-me}
      AUTH_ALLOWED_EMAIL_DOMAINS: ${AUTH_ALLOWED_EMAIL_DOMAINS:-example.com}
      AUTH_CLOCK_LEEWAY: ${AUTH_CLOCK_LEEWAY:-30s}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_JWKS_CACHE_TTL: ${OIDC_JWKS_CACHE_TTL:-15m}
      OIDC_HTTP_TIMEOUT: ${OIDC_HTTP_TIMEOUT:-5s}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - app_net
    logging: *default-logging

  worker:
    build:
      context: ./worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_VALUES: ${WORKER_MAX_VALUES:-10000}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WORKER_PORT:-8000}:8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - app_net
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        # Identitaet fuer den Dev-Header-Modus (nicht im JWT-Modus verwendet).
        VITE_DEMO_USER_EMAIL: ${VITE_DEMO_USER_EMAIL:-demo.user@example.com}
        VITE_BEARER_TOKEN: ${VITE_BEARER_TOKEN:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - app_net
    logging: *default-logging

volumes:
  postgres_data:
    name: anchor-postgres-data

networks:
  app_net:
    name: anchor-blueprint-net
    driver: bridge
